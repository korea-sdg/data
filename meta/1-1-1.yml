STAT_CONC_DEF: >- 
  ## Definition:
  
  국제빈곤층 이하 취업인구 비율
  근로빈곤율이라고도 불리는 하루 미화 1.90달러 선은
  1인당 가구에 거주하는 취업자의 비율로 정의됩니다.
  국제 빈곤선 이하의 소비 또는 소득
  미화 1.90달러.
  
  ## Concepts:
  
  **Employment:** All persons of working age who,
  during a short reference period (one week), were engaged in any activity to
  produce goods or provide services for pay or profit.
  
  
  **Poverty Line:** Threshold below which individuals
  in the reference population are considered poor and above which they are
  considered non-poor. The threshold is generally defined as the per-capita
  monetary requirements an individual needs to afford the purchase of a basic
  bundle of goods and services. For the purpose of this indicator, an absolute
  international poverty line of US$1.90 per day is used.
  
  
  **Household in poverty:** Households are defined as
  poor if their income or consumption expenditure is below the poverty line
  taking into account the number of household members and composition (e.g.,
  number of adults and children).
  
  
  **Working poor:** Employed persons living in
  households that are classified as poor, that is, that have income or
  consumption levels below the poverty line used for measurement.
